name: Build, test and publish NuGet

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:

    runs-on: windows-latest
    env:
      MAUI_COMPAT_PACKAGE_VERSION: 0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        global-json-file: global.json
    - name: Restore dependencies
      working-directory: src
      run: dotnet restore
    - name: Build
      working-directory: src
      run: dotnet build --configuration Release --no-restore
    - name: Test
      working-directory: src
      run: dotnet test --configuration Release --no-build --verbosity normal --collect "XPlat Code Coverage" --settings ../tests/coverage.runsettings --results-directory ../artifacts/coverage --logger trx
    - name: Upload test results and coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-and-coverage
        path: artifacts/coverage
        if-no-files-found: warn

    - name: Pack MAUI package for compatibility tests
      run: dotnet pack src/Tedd.WriteableBitmap.Maui/Tedd.WriteableBitmap.Maui.csproj --configuration Release --no-build --no-restore --output artifacts -p:PackageVersion="${{ env.MAUI_COMPAT_PACKAGE_VERSION }}"
    - name: Select .NET 10 SDK for platform compatibility checks
      shell: pwsh
      run: |
        Copy-Item global.json artifacts/package-sdk.global.json
        dotnet new globaljson --sdk-version 10.0.400 --roll-forward latestFeature --force
    - name: Restore MAUI workloads
      env:
        UsePackedTeddMaui: 'true'
        TeddMauiPackageVersion: ${{ env.MAUI_COMPAT_PACKAGE_VERSION }}
        RestoreAdditionalProjectSources: ${{ github.workspace }}/artifacts
      run: dotnet workload restore tests/Tedd.WriteableBitmap.Maui.Compatibility/Tedd.WriteableBitmap.Maui.Compatibility.csproj --skip-manifest-update
    - name: Compile MAUI consumer for Windows
      run: dotnet build tests/Tedd.WriteableBitmap.Maui.Compatibility/Tedd.WriteableBitmap.Maui.Compatibility.csproj --configuration Release --framework net10.0-windows10.0.19041.0 -p:UsePackedTeddMaui=true -p:TeddMauiPackageVersion="${{ env.MAUI_COMPAT_PACKAGE_VERSION }}" -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts"
    - name: Compile MAUI consumer for Android
      run: dotnet build tests/Tedd.WriteableBitmap.Maui.Compatibility/Tedd.WriteableBitmap.Maui.Compatibility.csproj --configuration Release --framework net10.0-android -p:UsePackedTeddMaui=true -p:TeddMauiPackageVersion="${{ env.MAUI_COMPAT_PACKAGE_VERSION }}" -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts"
    - name: Compile MAUI consumer for iOS
      run: dotnet build tests/Tedd.WriteableBitmap.Maui.Compatibility/Tedd.WriteableBitmap.Maui.Compatibility.csproj --configuration Release --framework net10.0-ios --runtime iossimulator-x64 -p:UsePackedTeddMaui=true -p:TeddMauiPackageVersion="${{ env.MAUI_COMPAT_PACKAGE_VERSION }}" -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts"
    - name: Compile MAUI consumer for Mac Catalyst
      run: dotnet build tests/Tedd.WriteableBitmap.Maui.Compatibility/Tedd.WriteableBitmap.Maui.Compatibility.csproj --configuration Release --framework net10.0-maccatalyst --runtime maccatalyst-x64 -p:UsePackedTeddMaui=true -p:TeddMauiPackageVersion="${{ env.MAUI_COMPAT_PACKAGE_VERSION }}" -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts"
    - name: Restore package SDK selection
      if: always()
      shell: pwsh
      run: |
        if (Test-Path artifacts/package-sdk.global.json) {
          Copy-Item artifacts/package-sdk.global.json global.json -Force
        }

    - name: Pack release packages
      shell: pwsh
      run: |
        dotnet pack src/Tedd.WriteableBitmap/Tedd.WriteableBitmap.csproj --configuration Release --no-build --no-restore --output artifacts/packages -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet pack src/Tedd.WriteableBitmap.Maui/Tedd.WriteableBitmap.Maui.csproj --configuration Release --no-build --no-restore --output artifacts/packages -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Upload release packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/packages/*.*nupkg
        if-no-files-found: error
    - name: Publish WPF and MAUI to NuGet
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
          throw 'NUGET_API_KEY is not configured.'
        }
        $packages = @(Get-ChildItem artifacts/packages -Filter *.nupkg)
        if ($packages.Count -ne 2) { throw 'Expected both WPF and MAUI release packages.' }
        foreach ($package in $packages) {
          dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
    - name: Tag published versions
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        git fetch --tags origin
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $projects = @(
          @{ Path = 'src/Tedd.WriteableBitmap/Tedd.WriteableBitmap.csproj'; Prefix = 'v' },
          @{ Path = 'src/Tedd.WriteableBitmap.Maui/Tedd.WriteableBitmap.Maui.csproj'; Prefix = 'maui-v' }
        )
        foreach ($project in $projects) {
          [xml] $definition = Get-Content -LiteralPath $project.Path -Raw
          $version = @($definition.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version) { throw "No package version in $($project.Path)." }
          $tag = $project.Prefix + $version
          $existing = git tag --list $tag
          if (-not $existing) {
            git tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        }
